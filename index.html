<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Edwin's Tesla Passenger Control</title>
<style>
  :root { --bg:#111; --card:#1d1d1f; --text:#fff; --muted:#b8b8bd; --accent:#2f8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:linear-gradient(#171717,#0c0c0c); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; }
  main { max-width:900px; margin:auto; padding:34px 24px 44px; }
  h1 { font-size:34px; margin:0 0 6px; text-align:center; }
  .sub { text-align:center; color:var(--muted); margin-bottom:28px; }
  section { background:var(--card); border-radius:24px; padding:22px; margin:16px 0;
            box-shadow:0 10px 30px #0005; }
  h2 { font-size:21px; margin:0 0 16px; }
  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  button { border:0; border-radius:18px; padding:20px 12px; min-height:74px; color:white;
           background:#303033; font-size:20px; font-weight:600; touch-action:manipulation; }
  button:active { transform:scale(.97); background:#454548; }
  .temp { display:flex; align-items:center; justify-content:center; gap:18px; }
  .temp button { width:92px; font-size:34px; }
  #temp { font-size:44px; font-weight:700; min-width:125px; text-align:center; }
  .message { text-align:center; min-height:26px; color:#9fd0ff; margin-top:16px; }
  .footer { text-align:center; color:#777; font-size:13px; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>🚘 Edwin's Tesla</h1>
  <div class="sub">Passenger Controls</div>

  <section>
    <h2>🎵 Music</h2>
    <div class="row">
      <button onclick="send('previous')">⏮<br>Previous</button>
      <button onclick="send('play-pause')">▶️ / ⏸<br>Play</button>
      <button onclick="send('next')">⏭<br>Next</button>
    </div>
  </section>

  <section>
    <h2>🔊 Volume</h2>
    <div class="row">
      <button onclick="send('volume-down')">−</button>
      <button onclick="send('play-pause')">▶️ / ⏸</button>
      <button onclick="send('volume-up')">+</button>
    </div>
  </section>

  <section>
    <h2>🌡️ Cabin Temperature</h2>
    <div class="temp">
      <button onclick="changeTemp(-1)">−</button>
      <div id="temp">72°F</div>
      <button onclick="changeTemp(1)">+</button>
    </div>
    <div class="message" id="message"></div>
  </section>

  <div class="footer">Passenger controls are limited for your safety and privacy.</div>
</main>

<script>
let temperature = 72;
const MIN = 68, MAX = 76;

async function send(action, extra={}) {
  const message = document.getElementById("message");
  message.textContent = "Sending…";
  try {
    const r = await fetch("/api/control", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action, ...extra})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Command failed");
    message.textContent = "Done ✓";
    setTimeout(()=>message.textContent="",1200);
  } catch (e) {
    message.textContent = e.message;
  }
}

function changeTemp(delta) {
  const next = Math.max(MIN, Math.min(MAX, temperature + delta));
  if (next === temperature) return;
  temperature = next;
  document.getElementById("temp").textContent = `${temperature}°F`;
  send("set-temp", {temperature});
}
</script>
</body>
</html>
