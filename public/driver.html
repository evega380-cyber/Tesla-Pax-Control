<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">

<title>Pax Control — Driver</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080a0d;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 440px;
  background: #15191e;
  border: 1px solid #292f35;
  border-radius: 28px;
  padding: 28px;
}

.logo {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #1ed760;
  color: #07140b;
  font-size: 27px;
  margin-bottom: 20px;
}

h1 {
  margin: 0 0 7px;
  font-size: 31px;
}

.subtitle {
  color: #929aa2;
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 750;
  color: #aeb5bc;
  margin: 18px 0 8px;
}

input,
select {
  width: 100%;
  border: 1px solid #353b42;
  outline: none;
  background: #0d1013;
  color: white;
  border-radius: 15px;
  padding: 16px;
  font-size: 17px;
}

input:focus,
select:focus {
  border-color: #1ed760;
}

select {
  appearance: none;
  -webkit-appearance: none;

  background-image:
    linear-gradient(45deg, transparent 50%, #8f979f 50%),
    linear-gradient(135deg, #8f979f 50%, transparent 50%);

  background-position:
    calc(100% - 20px) 50%,
    calc(100% - 14px) 50%;

  background-size:
    6px 6px,
    6px 6px;

  background-repeat: no-repeat;

  padding-right: 42px;
}

.setupGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.setupGrid label {
  margin-top: 18px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 16px;
  font-size: 17px;
  font-weight: 800;
  margin-top: 13px;
}

.start {
  background: #1ed760;
  color: #06130a;
}

.end {
  background: #342025;
  color: #ff8585;
}

button:active {
  transform: scale(.98);
}

.ride {
  margin-top: 24px;
  padding: 18px;
  background: #0d1013;
  border-radius: 17px;
}

.status {
  color: #8f979f;
  font-size: 13px;
}

.passenger {
  font-size: 25px;
  font-weight: 800;
  margin-top: 5px;
}

.rideDetails {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.rideTag {
  display: inline-flex;
  align-items: center;
  padding: 7px 10px;
  border-radius: 10px;
  background: #1b2025;
  color: #c7cdd2;
  font-size: 12px;
  font-weight: 700;
}

.message {
  min-height: 22px;
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.success {
  color: #1ed760;
}

.error {
  color: #ff7777;
}

.private {
  text-align: center;
  color: #687078;
  font-size: 12px;
  margin-top: 22px;
}

@media(max-width: 420px) {
  .setupGrid {
    grid-template-columns: 1fr;
    gap: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🚘</div>

  <h1>Pax Control</h1>

  <div class="subtitle">
    Driver Setup
  </div>

  <label for="pin">
    Driver PIN
  </label>

  <input
    id="pin"
    type="password"
    inputmode="numeric"
    autocomplete="off"
    placeholder="Enter your driver PIN"
  >

  <label for="passengerName">
    Passenger first name
  </label>

  <input
    id="passengerName"
    type="text"
    maxlength="30"
    autocomplete="off"
    placeholder="e.g. Jessica"
  >

  <div class="setupGrid">

    <div>

      <label for="rideApp">
        Ride App
      </label>

      <select id="rideApp">
        <option value="uber">
          Uber
        </option>

        <option value="lyft">
          Lyft
        </option>

        <option value="empower">
          Empower
        </option>

        <option value="other">
          Other
        </option>
      </select>

    </div>

    <div>

      <label for="language">
        Language
      </label>

      <select id="language">

        <option value="en">
          🇺🇸 English
        </option>

        <option value="es">
          🇪🇸 Español
        </option>

        <option value="pt">
          🇧🇷 Português
        </option>

      </select>

    </div>

  </div>

  <button
    class="start"
    onclick="startRide()"
  >
    Start Ride
  </button>

  <div class="ride">

    <div class="status">
      CURRENT RIDE
    </div>

    <div
      id="currentPassenger"
      class="passenger"
    >
      No active ride
    </div>

    <div
      id="rideDetails"
      class="rideDetails"
      style="display:none"
    >

      <div
        id="currentApp"
        class="rideTag"
      ></div>

      <div
        id="currentLanguage"
        class="rideTag"
      ></div>

    </div>

  </div>

  <button
    class="end"
    onclick="endRide()"
  >
    End Ride
  </button>

  <div
    id="message"
    class="message"
  ></div>

  <div class="private">
    🔒 Driver controls
  </div>

</div>

<script>

const pinInput =
  document.getElementById("pin");

const nameInput =
  document.getElementById(
    "passengerName"
  );

const rideAppInput =
  document.getElementById(
    "rideApp"
  );

const languageInput =
  document.getElementById(
    "language"
  );

const passengerDisplay =
  document.getElementById(
    "currentPassenger"
  );

const rideDetails =
  document.getElementById(
    "rideDetails"
  );

const currentApp =
  document.getElementById(
    "currentApp"
  );

const currentLanguage =
  document.getElementById(
    "currentLanguage"
  );

const message =
  document.getElementById(
    "message"
  );


/* ---------------------------------------
   DISPLAY NAMES
--------------------------------------- */

const appNames = {
  uber: "Uber",
  lyft: "Lyft",
  empower: "Empower",
  other: "Other"
};

const languageNames = {
  en: "🇺🇸 English",
  es: "🇪🇸 Español",
  pt: "🇧🇷 Português"
};


/* ---------------------------------------
   MESSAGE
--------------------------------------- */

function showMessage(
  text,
  type = ""
) {

  message.textContent =
    text;

  message.className =
    "message " + type;
}


/* ---------------------------------------
   DRIVER REQUEST
--------------------------------------- */

async function driverRequest(
  url,
  options = {}
) {

  const pin =
    pinInput.value.trim();

  if (!pin) {

    throw new Error(
      "Enter your driver PIN."
    );
  }

  const response =
    await fetch(
      url,
      {
        ...options,

        headers: {

          "X-Driver-Pin":
            pin,

          ...(options.headers || {})
        }
      }
    );

  let data = {};

  try {

    data =
      await response.json();

  } catch {}

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}


/* ---------------------------------------
   CURRENT RIDE DISPLAY
--------------------------------------- */

function displayRide(
  ride
) {

  if (!ride || !ride.active) {

    passengerDisplay.textContent =
      "No active ride";

    rideDetails.style.display =
      "none";

    return;
  }

  passengerDisplay.textContent =
    ride.passengerName ||
    "Passenger";

  const app =
    ride.rideApp ||
    "other";

  const language =
    ride.language ||
    "en";

  currentApp.textContent =
    appNames[app] ||
    "Other";

  currentLanguage.textContent =
    languageNames[language] ||
    "🇺🇸 English";

  rideDetails.style.display =
    "flex";
}


/* ---------------------------------------
   START RIDE
--------------------------------------- */

async function startRide() {

  const passengerName =
    nameInput.value.trim();

  const rideApp =
    rideAppInput.value;

  const language =
    languageInput.value;

  if (!passengerName) {

    showMessage(
      "Enter the passenger's first name.",
      "error"
    );

    return;
  }

  try {

    const data =
      await driverRequest(
        "/api/driver/start-ride",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              passengerName,
              rideApp,
              language
            })
        }
      );

    displayRide(
      data.ride
    );

    nameInput.value =
      "";

    showMessage(
      "Ride started ✓",
      "success"
    );

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );
  }
}


/* ---------------------------------------
   END RIDE
--------------------------------------- */

async function endRide() {

  try {

    await driverRequest(
      "/api/driver/end-ride",
      {
        method: "POST"
      }
    );

    displayRide(null);

    showMessage(
      "Ride ended ✓",
      "success"
    );

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );
  }
}


/* ---------------------------------------
   CHECK CURRENT RIDE
--------------------------------------- */

async function checkRide() {

  if (!pinInput.value.trim()) {
    return;
  }

  try {

    const data =
      await driverRequest(
        "/api/driver/ride"
      );

    displayRide(
      data
    );

  } catch {

    /*
     * Don't repeatedly display errors
     * while the driver is entering PIN.
     */
  }
}


pinInput.addEventListener(
  "change",
  checkRide
);

</script>

</body>
</html>
