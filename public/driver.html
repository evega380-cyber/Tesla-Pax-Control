<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">

<title>Pax Control — Driver</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080a0d;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 440px;
  background: #15191e;
  border: 1px solid #292f35;
  border-radius: 28px;
  padding: 28px;
}

.logo {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #1ed760;
  color: #07140b;
  font-size: 27px;
  margin-bottom: 20px;
}

h1 {
  margin: 0 0 7px;
  font-size: 31px;
}

.subtitle {
  color: #929aa2;
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 750;
  color: #aeb5bc;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  border: 1px solid #353b42;
  outline: none;
  background: #0d1013;
  color: white;
  border-radius: 15px;
  padding: 16px;
  font-size: 17px;
}

input:focus {
  border-color: #1ed760;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 16px;
  font-size: 17px;
  font-weight: 800;
  margin-top: 13px;
}

.start {
  background: #1ed760;
  color: #06130a;
}

.end {
  background: #342025;
  color: #ff8585;
}

button:active {
  transform: scale(.98);
}

.ride {
  margin-top: 24px;
  padding: 18px;
  background: #0d1013;
  border-radius: 17px;
}

.status {
  color: #8f979f;
  font-size: 13px;
}

.passenger {
  font-size: 25px;
  font-weight: 800;
  margin-top: 5px;
}

.message {
  min-height: 22px;
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.success {
  color: #1ed760;
}

.error {
  color: #ff7777;
}

.private {
  text-align: center;
  color: #687078;
  font-size: 12px;
  margin-top: 22px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🚘</div>

  <h1>Pax Control</h1>

  <div class="subtitle">
    Driver Setup
  </div>

  <label for="pin">
    Driver PIN
  </label>

  <input
    id="pin"
    type="password"
    inputmode="numeric"
    autocomplete="off"
    placeholder="Enter your driver PIN"
  >

  <label for="passengerName">
    Passenger first name
  </label>

  <input
    id="passengerName"
    type="text"
    maxlength="30"
    autocomplete="off"
    placeholder="e.g. Jessica"
  >

  <button
    class="start"
    onclick="startRide()"
  >
    Start Ride
  </button>

  <div class="ride">
    <div class="status">
      CURRENT RIDE
    </div>

    <div
      id="currentPassenger"
      class="passenger"
    >
      No active ride
    </div>
  </div>

  <button
    class="end"
    onclick="endRide()"
  >
    End Ride
  </button>

  <div
    id="message"
    class="message"
  ></div>

  <div class="private">
    🔒 Driver controls
  </div>

</div>

<script>
const pinInput =
  document.getElementById("pin");

const nameInput =
  document.getElementById(
    "passengerName"
  );

const passengerDisplay =
  document.getElementById(
    "currentPassenger"
  );

const message =
  document.getElementById("message");

function showMessage(
  text,
  type = ""
) {
  message.textContent = text;

  message.className =
    "message " + type;
}

async function driverRequest(
  url,
  options = {}
) {
  const pin =
    pinInput.value.trim();

  if (!pin) {
    throw new Error(
      "Enter your driver PIN."
    );
  }

  const response =
    await fetch(
      url,
      {
        ...options,

        headers: {
          "X-Driver-Pin":
            pin,

          ...(options.headers || {})
        }
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}

async function startRide() {
  const passengerName =
    nameInput.value.trim();

  if (!passengerName) {
    showMessage(
      "Enter the passenger's first name.",
      "error"
    );

    return;
  }

  try {
    const data =
      await driverRequest(
        "/api/driver/start-ride",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              passengerName
            })
        }
      );

    passengerDisplay.textContent =
      data.ride.passengerName;

    nameInput.value = "";

    showMessage(
      "Ride started ✓",
      "success"
    );

  } catch (error) {
    showMessage(
      error.message,
      "error"
    );
  }
}

async function endRide() {
  try {
    await driverRequest(
      "/api/driver/end-ride",
      {
        method: "POST"
      }
    );

    passengerDisplay.textContent =
      "No active ride";

    showMessage(
      "Ride ended ✓",
      "success"
    );

  } catch (error) {
    showMessage(
      error.message,
      "error"
    );
  }
}

async function checkRide() {
  if (!pinInput.value.trim()) {
    return;
  }

  try {
    const data =
      await driverRequest(
        "/api/driver/ride"
      );

    passengerDisplay.textContent =
      data.active
        ? data.passengerName
        : "No active ride";

  } catch {
    /*
     * Don't repeatedly display errors
     * while the driver is entering PIN.
     */
  }
}

pinInput.addEventListener(
  "change",
  checkRide
);
</script>

</body>
</html>
