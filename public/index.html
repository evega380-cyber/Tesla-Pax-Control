<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<title>Pax Control</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#080a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{min-height:100vh}
button,input{font:inherit}

.app{
  min-height:100vh;
  max-width:1400px;
  margin:auto;
  padding:max(24px,env(safe-area-inset-top)) 32px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 15% 0%,#20262d 0%,#0c0f13 38%,#07090b 78%);
}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:13px;font-size:23px;font-weight:800}
.logo{width:44px;height:44px;border-radius:50%;background:#1ed760;color:#06130a;display:grid;place-items:center;font-size:24px}
.status{color:#aab1b8;display:flex;align-items:center;gap:9px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#1ed760;box-shadow:0 0 14px #1ed760}

.main{
  display:grid;
  grid-template-columns:minmax(300px,.82fr) minmax(440px,1.18fr);
  gap:50px;
  align-items:center;
}

.artwork{
  width:100%;
  max-width:475px;
  aspect-ratio:1;
  border-radius:27px;
  margin:auto;
  object-fit:cover;
  background:linear-gradient(145deg,#222932,#0d1014);
  box-shadow:0 30px 70px rgba(0,0,0,.55);
}

.info{min-width:0}
.eyebrow{color:#1ed760;font-size:13px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:13px}
.title{font-size:clamp(38px,5vw,65px);font-weight:850;letter-spacing:-2px;line-height:1.02;margin:0 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:23px;color:#aeb5bd;margin-bottom:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.progressRow{display:flex;align-items:center;gap:12px;color:#899198;font-size:12px}
.progress{height:5px;background:#343a40;border-radius:20px;overflow:hidden;flex:1}
.progressFill{height:100%;width:0;background:#fff;border-radius:20px}

.media{display:flex;justify-content:center;align-items:center;gap:32px;margin:25px 0}
.media button{border:0;background:transparent;color:#fff;width:64px;height:64px;border-radius:50%;font-size:31px}
.media .play{width:82px;height:82px;background:#fff;color:#000;font-size:34px}
button:active{transform:scale(.92)}

.volume{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:16px 20px;
}
.volumeBtns{display:flex;gap:10px}
.smallBtn,.tempBtn{
  border:0;background:rgba(255,255,255,.1);color:#fff;
  width:55px;height:48px;border-radius:14px;font-size:23px;
}

.searchBox{
  margin-top:25px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px;
}

.searchBar{display:flex;gap:10px}
.searchBar input{
  flex:1;border:0;outline:0;border-radius:15px;
  padding:14px 17px;background:#fff;color:#111;font-size:16px;
}
.searchButton{
  border:0;border-radius:15px;padding:0 22px;
  background:#1ed760;color:#07140b;font-weight:800;
}

.results{
  max-height:245px;
  overflow-y:auto;
  margin-top:12px;
}

.track{
  display:grid;
  grid-template-columns:54px 1fr auto;
  gap:12px;
  align-items:center;
  padding:9px;
  border-radius:13px;
  cursor:pointer;
}
.track:active{background:rgba(255,255,255,.1)}
.track img{width:54px;height:54px;border-radius:8px;object-fit:cover}
.trackName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackArtist{font-size:13px;color:#999fa6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackPlay{color:#1ed760;font-size:22px;padding:10px}

.climate{
  margin-top:25px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:18px 26px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
}
.climateTitle{font-weight:750}
.climateSub{color:#8f979f;font-size:13px;margin-top:4px}
.tempControls{display:flex;align-items:center;gap:19px}
.tempBtn{border-radius:50%;height:52px;width:52px}
.temperature{font-size:37px;font-weight:800;min-width:105px;text-align:center}
.setTemp{justify-self:end;border:0;border-radius:15px;padding:14px 22px;background:#1ed760;color:#06130a;font-weight:800}

.message{height:22px;text-align:center;margin-top:10px;color:#999}
.success{color:#1ed760}.error{color:#ff7373}

@media(max-width:850px){
 .main{grid-template-columns:1fr;gap:25px}
 .artwork{max-width:400px}
 .info{text-align:center}
 .volume,.searchBox{text-align:left}
 .climate{grid-template-columns:1fr;text-align:center}
 .tempControls{justify-content:center}
 .setTemp{justify-self:center}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand"><div class="logo">♪</div>Pax Control</div>
  <div class="status"><span class="dot"></span>Spotify • Tesla</div>
</header>

<main class="main">

  <img id="artwork" class="artwork" alt="Album artwork">

  <section class="info">

    <div class="eyebrow">Now Playing</div>
    <h1 id="songTitle" class="title">Your Music</h1>
    <div id="artistName" class="artist">Playing in your Tesla</div>

    <div class="progressRow">
      <span id="currentTime">0:00</span>
      <div class="progress"><div id="progressFill" class="progressFill"></div></div>
      <span id="duration">--:--</span>
    </div>

    <div class="media">
      <button onclick="control('previous')">◀</button>
      <button id="playButton" class="play" onclick="control('playPause')">▶</button>
      <button onclick="control('next')">▶</button>
    </div>

    <div class="volume">
      <strong>🔊 Cabin Volume</strong>
      <div class="volumeBtns">
        <button class="smallBtn" onclick="control('volumeDown')">−</button>
        <button class="smallBtn" onclick="control('volumeUp')">+</button>
      </div>
    </div>

    <div class="searchBox">
      <div class="searchBar">
        <input id="searchInput" type="search"
               placeholder="Search songs or artists…"
               onkeydown="if(event.key==='Enter') searchSpotify()">
        <button class="searchButton" onclick="searchSpotify()">Search</button>
      </div>
      <div id="results" class="results"></div>
    </div>

  </section>
</main>

<section class="climate">
  <div>
    <div class="climateTitle">Cabin Climate</div>
    <div class="climateSub">Passenger comfort · 65–72°F</div>
  </div>

  <div class="tempControls">
    <button class="tempBtn" onclick="changeTemp(-1)">−</button>
    <div id="temperature" class="temperature">70°F</div>
    <button class="tempBtn" onclick="changeTemp(1)">+</button>
  </div>

  <button class="setTemp" onclick="setTemperature()">Set Temperature</button>
</section>

<div id="message" class="message"></div>

</div>

<script>
const MIN_TEMP=65;
const MAX_TEMP=72;
let selectedTemperature=70;
let progressMs=0;
let durationMs=0;
let playing=false;
let progressTimer=null;

const message=document.getElementById("message");

function showMessage(text,type=""){
  message.textContent=text;
  message.className="message "+type;
  if(text){
    setTimeout(()=>{
      if(message.textContent===text){
        message.textContent="";
        message.className="message";
      }
    },3000);
  }
}

async function api(url,options={}){
  const response=await fetch(url,{
    credentials:"same-origin",
    ...options
  });

  let data={};
  try{data=await response.json();}catch{}

  if(!response.ok){
    throw new Error(data.error||"Request failed.");
  }
  return data;
}

async function control(action){
  try{
    await api("/api/control",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action})
    });

    if(action==="playPause"){
      playing=!playing;
      updatePlayButton();
    }

    setTimeout(loadNowPlaying,700);
  }catch(e){
    showMessage(e.message,"error");
  }
}

function changeTemp(amount){
  selectedTemperature=Math.max(
    MIN_TEMP,
    Math.min(MAX_TEMP,selectedTemperature+amount)
  );
  document.getElementById("temperature").textContent=
    selectedTemperature+"°F";
}

async function setTemperature(){
  try{
    await api("/api/control",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"temperature",
        temperatureF:selectedTemperature
      })
    });
    showMessage(`Cabin set to ${selectedTemperature}°F`,"success");
  }catch(e){
    showMessage(e.message,"error");
  }
}

function formatTime(ms){
  if(!Number.isFinite(ms)||ms<0)return "0:00";
  const total=Math.floor(ms/1000);
  const min=Math.floor(total/60);
  const sec=String(total%60).padStart(2,"0");
  return `${min}:${sec}`;
}

function updateProgress(){
  document.getElementById("currentTime").textContent=formatTime(progressMs);
  document.getElementById("duration").textContent=
    durationMs?formatTime(durationMs):"--:--";

  const pct=durationMs?
    Math.min(100,(progressMs/durationMs)*100):0;

  document.getElementById("progressFill").style.width=pct+"%";
}

function updatePlayButton(){
  document.getElementById("playButton").textContent=
    playing?"❚❚":"▶";
}

async function loadNowPlaying(){
  try{
    const data=await api("/api/spotify/now-playing");

    if(!data.item){
      playing=false;
      updatePlayButton();
      return;
    }

    playing=data.playing;
    progressMs=data.progressMs||0;
    durationMs=data.item.durationMs||0;

    document.getElementById("songTitle").textContent=
      data.item.name||"Unknown Track";

    document.getElementById("artistName").textContent=
      data.item.artist||"Unknown Artist";

    const artwork=document.getElementById("artwork");

    if(data.item.artwork){
      artwork.src=data.item.artwork;
    }

    updatePlayButton();
    updateProgress();

  }catch(e){
    console.log("Now playing unavailable:",e.message);
  }
}

async function searchSpotify(){
  const input=document.getElementById("searchInput");
  const results=document.getElementById("results");
  const query=input.value.trim();

  if(!query)return;

  results.innerHTML="<div style='padding:15px;color:#999'>Searching…</div>";

  try{
    const data=await api(
      "/api/spotify/search?q="+encodeURIComponent(query)
    );

    results.innerHTML="";

    if(!data.tracks?.length){
      results.innerHTML=
        "<div style='padding:15px;color:#999'>No tracks found.</div>";
      return;
    }

    for(const track of data.tracks){
      const row=document.createElement("div");
      row.className="track";

      const img=document.createElement("img");
      if(track.artwork)img.src=track.artwork;
      img.alt="";

      const info=document.createElement("div");

      const name=document.createElement("div");
      name.className="trackName";
      name.textContent=track.name;

      const artist=document.createElement("div");
      artist.className="trackArtist";
      artist.textContent=track.artist;

      info.append(name,artist);

      const play=document.createElement("div");
      play.className="trackPlay";
      play.textContent="▶";

      row.append(img,info,play);

      row.onclick=()=>playTrack(track);

      results.appendChild(row);
    }

  }catch(e){
    results.innerHTML="";
    showMessage(e.message,"error");
  }
}

async function playTrack(track){
  showMessage(`Playing ${track.name}…`);

  try{
    await api("/api/spotify/play",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uri:track.uri})
    });

    playing=true;
    updatePlayButton();

    showMessage(`Playing ${track.name}`,"success");

    setTimeout(loadNowPlaying,1000);

  }catch(e){
    showMessage(e.message,"error");
  }
}

/* Locally animate progress between Spotify updates */
setInterval(()=>{
  if(playing && durationMs){
    progressMs=Math.min(durationMs,progressMs+1000);
    updateProgress();
  }
},1000);

/* Refresh Spotify metadata periodically */
loadNowPlaying();
setInterval(loadNowPlaying,5000);
</script>

</body>
</html>
